title = "Automated Documentation Sync local rules"

[extend]
useDefault = true

[[rules]]
id = "credential-assignment"
description = "Credential-like assignment in eligible text"
regex = '''(?i)(?:password|passwd|secret|token|api[_-]?key|client[_-]?secret|connection[_-]?string)\s*[:=]\s*["']?([A-Za-z0-9_./+=:-]{8,})'''
secretGroup = 1
keywords = ["password", "passwd", "secret", "token", "api_key", "api-key", "client_secret", "connection_string"]
tags = ["key", "secret", "token"]

[[rules]]
id = "private-key-header"
description = "Private key header"
regex = '''-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'''
keywords = ["PRIVATE KEY"]
tags = ["key", "secret"]