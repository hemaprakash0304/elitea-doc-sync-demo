name: Docs Sync Foundation

on:
  workflow_dispatch:
    inputs:
      target_repository:
        description: Target repository in OWNER/REPO format
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: docs-sync-${{ inputs.target_repository }}
  cancel-in-progress: false

jobs:
  validate-target:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out workflow repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and test foundation
        run: npm test

      - name: Validate target configuration
        env:
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
          DOCS_SYNC_READ_APP_ID: ${{ vars.DOCS_SYNC_READ_APP_ID }}
          DOCS_SYNC_READ_APP_INSTALLATION_ID: ${{ vars.DOCS_SYNC_READ_APP_INSTALLATION_ID }}
          DOCS_SYNC_READ_APP_PRIVATE_KEY: ${{ secrets.DOCS_SYNC_READ_APP_PRIVATE_KEY }}
          DOCS_SYNC_AUTOMATED_TESTS_PASSED: "true"
        run: npm run docs:sync -- --repository "$TARGET_REPOSITORY" --validate-only

  propose-change:
    needs: validate-target
    environment: docs-sync-proposal
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out workflow repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Revalidate and create review proposal
        env:
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
          DOCS_SYNC_AUTOMATED_TESTS_PASSED: "true"
          DOCS_SYNC_READ_APP_ID: ${{ vars.DOCS_SYNC_READ_APP_ID }}
          DOCS_SYNC_READ_APP_INSTALLATION_ID: ${{ vars.DOCS_SYNC_READ_APP_INSTALLATION_ID }}
          DOCS_SYNC_READ_APP_PRIVATE_KEY: ${{ secrets.DOCS_SYNC_READ_APP_PRIVATE_KEY }}
          DOCS_SYNC_PROPOSAL_APP_ID: ${{ vars.DOCS_SYNC_PROPOSAL_APP_ID }}
          DOCS_SYNC_PROPOSAL_APP_INSTALLATION_ID: ${{ vars.DOCS_SYNC_PROPOSAL_APP_INSTALLATION_ID }}
          DOCS_SYNC_PROPOSAL_APP_PRIVATE_KEY: ${{ secrets.DOCS_SYNC_PROPOSAL_APP_PRIVATE_KEY }}
          DOCS_SYNC_PROPOSAL_BRANCH_PROTECTION_CONFIRMED: ${{ vars.DOCS_SYNC_PROPOSAL_BRANCH_PROTECTION_CONFIRMED }}
        run: npm run docs:sync -- --repository "$TARGET_REPOSITORY"